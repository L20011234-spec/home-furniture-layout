  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="description" content="三房现代暖木家具布局，查看家具彩平、五幅空间效果图及可旋转的全屋三维模型。">
  <title>三房家具布局 · 现代暖木</title>
  <link rel="stylesheet" href="site.css">
  <script defer src="gallery.js"></script>
</head>
<body>
  <header class="mast">
    <div class="wrap mast-inner">
      <a class="brand" href="index.html" aria-label="三房家具布局首页"><i aria-hidden="true"></i>三房家具布局</a>
      <nav aria-label="主导航"><a href="#floor">家具平面</a><a href="#spaces">空间效果</a><a href="3d/index.html">三维模型</a></nav>
    </div>
  </header>
  <main>
    <section class="wrap hero" id="floor" aria-labelledby="title">
      <div class="intro">
        <h1 id="title">三房<br>家具布局</h1>
        <p class="lede">中央餐厅串联客厅与两侧卧室。四人餐桌偏右布置，左侧留出日常通行的位置。</p>
        <dl class="facts"><div><dt>风格</dt><dd>现代暖木</dd></div><div><dt>层高</dt><dd>2.90 <span>米</span></dd></div></dl>
        <div class="intro-actions"><a class="primary" href="3d/index.html">打开 3D 模型</a><a class="text-link" href="assets/layout-originals.zip" download="三房家具布局原图.zip">下载全套原图</a></div>
      </div>
      <figure class="plan">
        <a class="plan-image" href="assets/floor-plan.png" data-shot="plan-detail" data-title="家具彩平图" aria-label="放大家具彩平图">
          <img src="assets/floor-plan.png" alt="三房家具彩平图，标示主卧、次卧、客餐厅、厨房和预留多功能房" fetchpriority="high">
        </a>
        <figcaption><span>家具彩平图</span><a href="assets/floor-plan.png" data-open="plan-detail">放大平面图</a></figcaption>
      </figure>
    </section>

    <section class="wrap layout-notes" aria-labelledby="layout-title">
      <h2 id="layout-title">平面布置</h2>
      <div class="note"><h3>客餐厅与卧室</h3><p>上中客厅配 2.60 米沙发。餐桌与厨房之间图上约留 0.93 米，次卧入口转角待复尺。左上主卧配 1.80 米床，次卧配 1.55 米床。</p></div>
      <div class="note"><h3>厨房与多功能房</h3><p>红线墙段已拉直。左下一字厨柜暂作试摆，管线待核。右下配沙发床、桌椅和书柜，门位待确定。右中小间暂留空。</p></div>
    </section>

    <section class="wrap gallery" id="spaces" aria-labelledby="spaces-title">
      <div class="section-head"><h2 id="spaces-title">空间效果</h2><p>点击图片可查看原图</p></div>
      <div class="shots">
        <figure><a class="shot" href="assets/overview.jpg" data-shot="overview-detail" data-title="全屋总览"><img src="assets/overview.jpg" loading="lazy" decoding="async" alt="全屋家具布局的开顶鸟瞰效果"></a><figcaption><h3>全屋总览</h3><a href="assets/overview.jpg" download>下载原图</a></figcaption></figure>
        <figure><a class="shot" href="assets/living.jpg" data-shot="living-detail" data-title="客厅"><img src="assets/living.jpg" loading="lazy" decoding="async" alt="客厅沙发、茶几与周边动线"></a><figcaption><h3>客厅</h3><a href="assets/living.jpg" download>下载原图</a></figcaption></figure>
        <figure><a class="shot" href="assets/dining.jpg" data-shot="dining-detail" data-title="中央餐厅"><img src="assets/dining.jpg" loading="lazy" decoding="async" alt="中央餐厅的餐桌、餐椅与通行空间"></a><figcaption><h3>中央餐厅</h3><a href="assets/dining.jpg" download>下载原图</a></figcaption></figure>
        <figure><a class="shot" href="assets/main-bedroom.jpg" data-shot="bedroom-detail" data-title="主卧"><img src="assets/main-bedroom.jpg" loading="lazy" decoding="async" alt="主卧床区与收纳布置"></a><figcaption><h3>主卧</h3><a href="assets/main-bedroom.jpg" download>下载原图</a></figcaption></figure>
        <figure><a class="shot" href="assets/kitchen.jpg" data-shot="kitchen-detail" data-title="一字厨房试摆"><img src="assets/kitchen.jpg" loading="lazy" decoding="async" alt="左下窄位的一字厨柜试摆，管线位置待核"></a><figcaption><h3>一字厨房试摆</h3><a href="assets/kitchen.jpg" download>下载原图</a></figcaption></figure>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><span>三房家具布局</span><a href="assets/layout-originals.zip" download="三房家具布局原图.zip">下载全套原图 ZIP</a></div></footer>

  <dialog class="lightbox" aria-labelledby="lightbox-title">
    <div class="lightbox-bar"><h2 id="lightbox-title"></h2><button type="button" class="lightbox-close">关闭</button></div>
    <div class="lightbox-stage" tabindex="0" aria-label="图片预览"><img alt=""></div>
    <div class="lightbox-controls">
      <div class="lightbox-paging"><button type="button" class="prev">上一张</button><span class="position" aria-live="polite"></span><button type="button" class="next">下一张</button></div>
      <div class="lightbox-actions"><button type="button" class="zoom" aria-pressed="false">原尺寸</button><a class="lightbox-download" download>下载原图</a></div>
    </div>
  </dialog>
</body>
</html>
